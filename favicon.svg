<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#78350F" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Ceiling Hook & String -->
  <line x1="50" y1="0" x2="50" y2="28" stroke="#D97706" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 3"/>
  <circle cx="50" cy="28" r="3.5" fill="#B45309"/>
  <!-- Character Head/Body -->
  <g filter="url(#fav-shadow)">
    <!-- Ears -->
    <circle cx="34" cy="40" r="10" fill="#F59E0B"/>
    <circle cx="34" cy="40" r="5" fill="#FDE68A"/>
    <circle cx="66" cy="40" r="10" fill="#F59E0B"/>
    <circle cx="66" cy="40" r="5" fill="#FDE68A"/>
    <!-- Head -->
    <circle cx="50" cy="58" r="26" fill="url(#fav-bg)"/>
    <!-- Cheeks -->
    <ellipse cx="37" cy="62" rx="4" ry="2.5" fill="#F43F5E" opacity="0.35"/>
    <ellipse cx="63" cy="62" rx="4" ry="2.5" fill="#F43F5E" opacity="0.35"/>
    <!-- Eyes -->
    <circle cx="42" cy="54" r="3" fill="#1F2937"/>
    <circle cx="43" cy="53" r="1" fill="#FFFFFF"/>
    <circle cx="58" cy="54" r="3" fill="#1F2937"/>
    <circle cx="59" cy="53" r="1" fill="#FFFFFF"/>
    <!-- Snout & Mouth -->
    <ellipse cx="50" cy="61" rx="8" ry="6" fill="#FEF3C7"/>
    <ellipse cx="50" cy="59" rx="2.5" ry="1.8" fill="#78350F"/>
    <path d="M 48 62 Q 50 64 52 62" stroke="#78350F" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <!-- Clover badge -->
    <path d="M 50 74 C 47 70, 43 72, 45 76 C 43 78, 47 80, 50 78 C 53 80, 57 78, 55 76 C 57 72, 53 70, 50 74 Z" fill="#10B981"/>
  </g>
</svg>
